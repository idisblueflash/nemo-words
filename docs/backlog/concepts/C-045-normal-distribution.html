<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Normal distribution</title>
<!-- The figure for C-045. The backlog map shows it in the concept's side panel and sends it
     the map's colour tokens; opened alone, it uses the fallbacks below. -->
<style>
  :root {
    --bg: #f3efe8; --surface: #fbf9f5; --sunken: #e8e2d8; --rule: #ddd5c8;
    --ink: #2a2520; --ink-2: #574f46; --ink-3: #6f665b; --flash: #1d6871; --flash-wash: #d9e8e6; --on-flash: #ffffff;
    --mid: #2a78d6; --tail: #eb6834;
    --font-ui: "Avenir Next", Avenir, "Segoe UI", system-ui, sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1a1714; --surface: #23201c; --sunken: #13110f; --rule: #353029;
      --ink: #ebe5db; --ink-2: #b8afa2; --ink-3: #958c7f; --flash: #74c2c6; --flash-wash: #1c3537; --on-flash: #0f2224;
      --mid: #3987e5; --tail: #d95926; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] { --mid: #3987e5; --tail: #d95926; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 13px/1.45 var(--font-ui); padding: 12px; display: grid; gap: 12px; }
  .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--flash); outline-offset: 1px; }

  .presets { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--rule); background: var(--surface); }
  .chip:hover { border-color: var(--ink-3); }
  .chip[aria-pressed="true"] { background: var(--flash); border-color: var(--flash); color: var(--on-flash); }
  .chip .num { font-size: 11px; opacity: .8; margin-left: 4px; }

  .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px 18px; }
  .ctl { display: grid; gap: 3px; min-width: 0; }
  .ctl label { font-size: 12px; color: var(--ink-2); display: flex; justify-content: space-between; gap: 8px; }
  .ctl output { font-family: var(--font-mono); color: var(--ink); }
  input[type=range] { width: 100%; margin: 0; accent-color: var(--flash); }
  .check { font-size: 12px; color: var(--ink-2); display: flex; gap: 6px; align-items: center; }
  .check input { accent-color: var(--flash); margin: 0; }

  .readout { display: flex; flex-wrap: wrap; gap: 4px 20px; }
  .readout div { display: grid; }
  .readout .k { font-size: 11px; color: var(--ink-3); letter-spacing: .05em; text-transform: uppercase; }
  .readout .v { font-family: var(--font-mono); font-size: 15px; font-variant-numeric: tabular-nums; }
  .sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; }

  h2 { font-size: 11px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-2); margin: 4px 0 0; }
  .chart { position: relative; }
  svg { display: block; width: 100%; height: auto; }
  svg text { font-family: var(--font-ui); fill: var(--ink-2); font-size: 11px; }
  svg .mono { font-family: var(--font-mono); fill: var(--ink-3); }
  .tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 11px; padding: 4px 7px;
         border-radius: 5px; white-space: nowrap; transform: translate(-50%, calc(-100% - 8px)); z-index: 2; }
  .note { color: var(--ink-3); font-size: 12px; margin: 0; }
  .say { margin: 0; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .btn { font-size: 12px; padding: 3px 10px; border-radius: 6px; border: 1px solid var(--rule); background: var(--surface); }
  .btn:hover { border-color: var(--ink-3); }
</style>
</head>
<body>
  <div class="presets" id="presets" role="group" aria-label="Examples from the spikes"></div>
  <div class="controls">
    <div class="ctl"><label for="n">Words in each set <output id="nOut"></output></label><input type="range" id="n" min="5" max="300" step="1"></div>
    <div class="ctl"><label for="p">True rate <output id="pOut"></output></label><input type="range" id="p" min="1" max="99" step="0.1"></div>
    <div class="ctl"><label for="c">Certainty <output id="cOut"></output></label><input type="range" id="c" min="50" max="99.9" step="0.1"></div>
  </div>
  <div class="readout" aria-live="polite">
    <div><span class="k">z</span><span class="v" id="rZ"></span></div>
    <div><span class="k">Standard error (SE)</span><span class="v" id="rSE"></span></div>
    <div><span class="k"><i class="sw" style="background:var(--mid)"></i>Middle range</span><span class="v" id="rRange"></span></div>
  </div>

  <h2>Where the measured rates fall</h2>
  <div class="chart" id="c1"></div>
  <p class="say" id="say1"></p>
  <label class="check"><input type="checkbox" id="binom"> Show the exact chances (binomial) as bars</label>
  <p class="note" id="note1"></p>

  <h2>Measure many sets and count</h2>
  <div class="row">
    <button type="button" class="btn" data-add="1">+1 set</button>
    <button type="button" class="btn" data-add="100">+100 sets</button>
    <button type="button" class="btn" data-add="1000">+1000 sets</button>
    <button type="button" class="btn" id="clear">Clear</button>
  </div>
  <div class="chart" id="c2"></div>
  <p class="say" id="say2"></p>
  <p class="note">Each set is a new random draw of words at the true rate. The bars count the measured rates. Change a slider to start again.</p>

<script>
const PRESETS = [
  { id: "sp064e", label: "SP-064 exact", n: 62, p: 13/62 },
  { id: "sp064t", label: "SP-064 in-three", n: 62, p: 26/62 },
  { id: "chance", label: "Chance 1/9", n: 62, p: 1/9 },
  { id: "small", label: "Small set", n: 10, p: 0.1 },
];
let state = { n: 62, p: 13/62, conf: 95, binom: false, preset: "sp064e" };
let sims = [];

// Math: the bell curve, its inverse, and the exact binomial chances.
function erf(x) {
  const s = Math.sign(x), a = Math.abs(x), t = 1 / (1 + 0.3275911 * a);
  const y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-a * a);
  return s * y;
}
const Phi = (z) => 0.5 * (1 + erf(z / Math.SQRT2));
function zFor(conf) { let lo = 0, hi = 8; const want = 0.5 + conf / 200; for (let i = 0; i < 60; i++) { const m = (lo + hi) / 2; Phi(m) < want ? lo = m : hi = m; } return (lo + hi) / 2; }
const pdf = (x, mu, sd) => Math.exp(-0.5 * ((x - mu) / sd) ** 2) / (sd * Math.sqrt(2 * Math.PI));
function lgamma(x) {
  const c = [0.99999999999980993, 676.5203681218851, -1259.1392167224028, 771.32342877765313, -176.61502916214059,
    12.507343278686905, -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7];
  x -= 1; let a = c[0]; const t = x + 7.5;
  for (let i = 1; i < 9; i++) a += c[i] / (x + i);
  return 0.5 * Math.log(2 * Math.PI) + (x + 0.5) * Math.log(t) - t + Math.log(a);
}
const pmf = (k, n, p) => Math.exp(lgamma(n + 1) - lgamma(k + 1) - lgamma(n - k + 1) + k * Math.log(p) + (n - k) * Math.log(1 - p));
const se = () => Math.sqrt(state.p * (1 - state.p) / state.n);
const inside = (k, z) => Math.abs(k / state.n - state.p) <= z * se() + 1e-12;

const pct = (x, d = 1) => (x * 100).toFixed(d) + "%";
const $ = (id) => document.getElementById(id);
function el(tag, attrs, parent, text) {
  const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const a in attrs) e.setAttribute(a, attrs[a]);
  if (text != null) e.textContent = text;
  if (parent) parent.appendChild(e);
  return e;
}
function tip(box, x, y, html) {
  let t = box.querySelector(".tip");
  if (!t) { t = document.createElement("div"); t.className = "tip"; box.appendChild(t); }
  t.innerHTML = html; t.hidden = false;
  const tw = t.offsetWidth;
  t.style.left = Math.min(Math.max(x, tw / 2 + 2), box.clientWidth - tw / 2 - 2) + "px";
  t.style.top = y + "px";
}
const untip = (box) => { const t = box.querySelector(".tip"); if (t) t.hidden = true; };

// One chart: the bell curve with its middle and tails, plus optional bars (one per hit count).
function draw(box, bars) {
  box.querySelectorAll("svg").forEach((s) => s.remove());
  const W = Math.max(300, box.clientWidth), H = 210, L = 10, R = 10, T = 30, B = 34;
  const { n, p } = state, s = se(), z = zFor(state.conf);
  const x0 = Math.max(0, p - 4.5 * s), x1 = Math.min(1, p + 4.5 * s);
  const peak = pdf(p, p, s), top = Math.max(peak, ...(bars || []).map((b) => b.h)) * 1.08;
  const x = (v) => L + (v - x0) / (x1 - x0) * (W - L - R), y = (h) => H - B - h / top * (H - T - B);
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "Bell curve of measured rates" }, box);

  const lo = p - z * s, hi = p + z * s;
  const area = (a, b, fill) => {
    a = Math.max(a, x0); b = Math.min(b, x1); if (b <= a) return;
    let d = `M${x(a)},${y(0)}`;
    for (let i = 0; i <= 80; i++) { const v = a + (b - a) * i / 80; d += `L${x(v).toFixed(1)},${y(pdf(v, p, s)).toFixed(1)}`; }
    el("path", { d: d + `L${x(b)},${y(0)}Z`, fill, opacity: bars ? .12 : .22 }, svg);
  };
  area(x0, lo, "var(--tail)"); area(lo, hi, "var(--mid)"); area(hi, x1, "var(--tail)");

  for (const b of bars || []) {
    const a = Math.max(x0, (b.k - .5) / n), c = Math.min(x1, (b.k + .5) / n);
    if (c <= a || b.h <= 0) continue;
    el("rect", { x: x(a) + .5, width: Math.max(1, x(c) - x(a) - 1), y: y(b.h), height: y(0) - y(b.h),
      fill: inside(b.k, z) ? "var(--mid)" : "var(--tail)", opacity: .7 }, svg);
  }

  let d = "";
  for (let i = 0; i <= 200; i++) { const v = x0 + (x1 - x0) * i / 200; d += `${i ? "L" : "M"}${x(v).toFixed(1)},${y(pdf(v, p, s)).toFixed(1)}`; }
  el("path", { d, fill: "none", stroke: "var(--ink)", "stroke-width": 1.6 }, svg);

  // Axis with ticks in percent.
  el("line", { x1: L, x2: W - R, y1: y(0), y2: y(0), stroke: "var(--rule)" }, svg);
  const span = (x1 - x0) * 100, step = [0.5, 1, 2, 5, 10, 20].find((st) => span / st <= 8) || 25;
  for (let t = Math.ceil(x0 * 100 / step) * step; t <= x1 * 100 + 1e-9; t += step) {
    el("line", { x1: x(t / 100), x2: x(t / 100), y1: y(0), y2: y(0) + 4, stroke: "var(--ink-3)" }, svg);
    el("text", { x: x(t / 100), y: H - B + 16, "text-anchor": "middle", class: "mono" }, svg, `${+t.toFixed(1)}%`);
  }

  // The center and the two ±z lines.
  el("line", { x1: x(p), x2: x(p), y1: y(peak), y2: y(0), stroke: "var(--ink-3)", "stroke-dasharray": "2 3" }, svg);
  el("text", { x: x(p), y: H - 4, "text-anchor": "middle", style: "fill: var(--ink)" }, svg, `true rate ${pct(p)}`);
  for (const [v, sign] of [[lo, "−"], [hi, "+"]]) {
    if (v < x0 || v > x1) continue;
    el("line", { x1: x(v), x2: x(v), y1: T - 8, y2: y(0), stroke: "var(--mid)", "stroke-width": 1.5 }, svg);
    el("text", { x: x(v), y: T - 12, "text-anchor": "middle", class: "mono", style: "fill: var(--ink)" }, svg, `${sign}${z.toFixed(2)} SE`);
  }
  const tail = (100 - state.conf) / 2;
  el("text", { x: x(p), y: y(peak * .42), "text-anchor": "middle", style: "fill: var(--ink); font-weight: 600" }, svg, `${+state.conf.toFixed(1)}%`);
  const tailX = (v) => x(v), tl = Math.max(x0, lo - 1.1 * s), tr = Math.min(x1, hi + 1.1 * s);
  if (x(lo) - L > 34) el("text", { x: tailX(tl), y: y(peak * .14) - 6, "text-anchor": "middle", style: "fill: var(--tail)" }, svg, `${+tail.toFixed(2)}%`);
  if (W - R - x(hi) > 34) el("text", { x: tailX(tr), y: y(peak * .14) - 6, "text-anchor": "middle", style: "fill: var(--tail)" }, svg, `${+tail.toFixed(2)}%`);

  // Hover: how far a rate is from the center, in standard errors.
  const hit = el("rect", { x: L, y: T, width: W - L - R, height: H - T - B, fill: "transparent" }, svg);
  const cross = el("line", { y1: T, y2: y(0), stroke: "var(--ink-2)", visibility: "hidden" }, svg);
  hit.addEventListener("pointermove", (e) => {
    const b = box.getBoundingClientRect(), sc = b.width / W, sx = (e.clientX - b.left) / sc;
    const v = x0 + (sx - L) / (W - L - R) * (x1 - x0), zz = (v - p) / s;
    cross.setAttribute("x1", sx); cross.setAttribute("x2", sx); cross.setAttribute("visibility", "visible");
    tip(box, sx * sc, y(pdf(v, p, s)) * sc,
      `<span class="num">${pct(v)}</span> is <span class="num">${Math.abs(zz).toFixed(2)}</span> SE ${zz < 0 ? "below" : "above"} the center`);
  });
  hit.addEventListener("pointerleave", () => { cross.setAttribute("visibility", "hidden"); untip(box); });
}

function drawAll() {
  const { n, p } = state, z = zFor(state.conf);
  let exact = null;
  if (state.binom) {
    exact = [];
    for (let k = 0; k <= n; k++) exact.push({ k, h: pmf(k, n, p) * n });
  }
  draw($("c1"), exact);
  const counts = new Array(n + 1).fill(0);
  for (const k of sims) counts[k]++;
  draw($("c2"), sims.length ? counts.map((c, k) => ({ k, h: c / sims.length * n })) : []);

  let inExact = 0;
  for (let k = 0; k <= n; k++) if (inside(k, z)) inExact += pmf(k, n, p);
  $("note1").textContent = state.binom
    ? `The exact chance that a set lands in the middle range is ${pct(inExact)}, not ${+state.conf.toFixed(1)}%. ` +
      `The bell curve is only an approximation. It fits best when the set is large and the rate is not near 0% or 100%.`
    : "The curve is smooth, but a real set can only score whole hits. Tick the box to see the difference.";
  const inSim = sims.filter((k) => inside(k, z)).length;
  $("say2").textContent = sims.length
    ? `${inSim} of ${sims.length} sets fall in the middle range (${pct(inSim / sims.length)}). The bell curve says ${+state.conf.toFixed(1)}%.`
    : "No sets yet. Press a button to measure some.";
}

const inMap = window.parent !== window;
const toMap = (msg) => { if (inMap) parent.postMessage(msg, "*"); };

function sync(save = true) {
  const { n, p } = state, s = se(), z = zFor(state.conf);
  $("n").value = n; $("p").value = (p * 100).toFixed(1); $("c").value = state.conf; $("binom").checked = state.binom;
  $("nOut").textContent = n; $("pOut").textContent = pct(p); $("cOut").textContent = `${+state.conf.toFixed(1)}%`;
  for (const b of $("presets").children) b.setAttribute("aria-pressed", b.dataset.id === state.preset);
  $("rZ").textContent = z.toFixed(3);
  $("rSE").textContent = pct(s, 2);
  $("rRange").textContent = `${pct(Math.max(0, p - z * s))} – ${pct(Math.min(1, p + z * s))}`;
  $("say1").textContent = `On sets of ${n} words, ${+state.conf.toFixed(1)}% of the measured rates fall within ` +
    `${z.toFixed(2)} × ${pct(s, 2)} = ${pct(z * s)} of the true rate. That distance is z standard errors.`;
  drawAll();
  if (save) toMap({ type: "backlog-map:figure-state", state });
}

for (const pr of PRESETS) {
  const b = document.createElement("button");
  b.type = "button"; b.className = "chip"; b.dataset.id = pr.id;
  b.innerHTML = `${pr.label}<span class="num">${pct(pr.p, 0)}, ${pr.n}</span>`;
  b.addEventListener("click", () => { state = { ...state, n: pr.n, p: pr.p, preset: pr.id }; sims = []; sync(); });
  $("presets").appendChild(b);
}
$("n").addEventListener("input", (e) => { state.n = +e.target.value; state.preset = null; sims = []; sync(); });
$("p").addEventListener("input", (e) => { state.p = +e.target.value / 100; state.preset = null; sims = []; sync(); });
$("c").addEventListener("input", (e) => { state.conf = +e.target.value; sync(); });
$("binom").addEventListener("change", (e) => { state.binom = e.target.checked; sync(); });
for (const b of document.querySelectorAll("[data-add]")) b.addEventListener("click", () => {
  for (let i = 0; i < +b.dataset.add; i++) { let k = 0; for (let j = 0; j < state.n; j++) if (Math.random() < state.p) k++; sims.push(k); }
  drawAll();
});
$("clear").addEventListener("click", () => { sims = []; drawAll(); });

addEventListener("message", (e) => {
  const m = e.data;
  if (e.source !== parent || !m || m.type !== "backlog-map:figure") return;
  const root = document.documentElement;
  for (const [k, v] of Object.entries(m.tokens || {})) if (v) root.style.setProperty(`--${k}`, v);
  root.dataset.theme = m.dark ? "dark" : "light";
  if (m.state && typeof m.state === "object") state = { ...state, ...m.state };
  sync(false);
});
new ResizeObserver(() => toMap({ type: "backlog-map:figure-height", height: document.body.offsetHeight })).observe(document.body);
let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(drawAll, 60); });
sync(false);
toMap({ type: "backlog-map:figure-ready" });
</script>
</body>
</html>
